<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal de Productores ALIVAL</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f7f5;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: #173b2a;
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: white;
      border-radius: 22px;
      padding: 32px 26px;
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.08);
      text-align: center;
    }

    .brand {
      font-size: 30px;
      font-weight: 800;
      letter-spacing: 1px;
      margin-bottom: 6px;
    }

    .subtitle {
      color: #68756e;
      margin: 0 0 28px;
      font-size: 15px;
    }

    h1 {
      font-size: 23px;
      margin: 0 0 8px;
    }

    .help {
      color: #68756e;
      font-size: 14px;
      margin: 0 0 22px;
    }

    label {
      display: block;
      text-align: left;
      font-size: 14px;
      font-weight: 700;
      margin: 15px 0 7px;
    }

    input {
      width: 100%;
      padding: 14px 15px;
      border: 1px solid #d7dfda;
      border-radius: 12px;
      font-size: 16px;
      outline: none;
      background: #fafcfb;
    }

    input:focus {
      border-color: #4f8f68;
      box-shadow: 0 0 0 3px rgba(79, 143, 104, 0.12);
    }

    button {
      width: 100%;
      margin-top: 24px;
      padding: 15px;
      border: 0;
      border-radius: 12px;
      background: #173b2a;
      color: white;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    .footer {
      margin-top: 24px;
      color: #89948e;
      font-size: 12px;
    }
  </style>
</head>

<body>

  <main class="card">

    <div class="brand">ALIVAL</div>

    <p class="subtitle">
      Portal de Productores
    </p>

    <h1>
      Consulta tus documentos
    </h1>

    <p class="help">
      Ingresa tu código de finca y PIN para continuar.
    </p>

    <form onsubmit="event.preventDefault(); mostrarMensaje();">

      <label for="codigo">
        Código de finca
      </label>

      <input
        id="codigo"
        type="text"
        inputmode="numeric"
        placeholder="Ej. 1054"
        autocomplete="off"
      >

      <label for="pin">
        PIN
      </label>

      <input
        id="pin"
        type="password"
        inputmode="numeric"
        placeholder="Ingresa tu PIN"
        autocomplete="off"
      >

      <button type="submit">
        Ingresar
      </button>

    </form>

    <div id="mensaje" class="footer">
      Portal en etapa de configuración
    </div>

  </main>

  <script>

    function mostrarMensaje() {

      document.getElementById("mensaje").textContent =
        "Estamos preparando tu acceso. Próximamente podrás consultar tus reportes.";

    }

  </script>

</body>
</html>
