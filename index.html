<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Portal de Productores ALIVAL</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f3f6f8;
      color: #263238;
    }

    .barra-superior {
      height: 7px;
      display: flex;
    }

    .barra-verde {
      flex: 1;
      background: #5aa832;
    }

    .barra-roja {
      flex: 1;
      background: #df2027;
    }

    .barra-azul {
      flex: 2;
      background: #0066a6;
    }

    .pagina {
      min-height: calc(100vh - 7px);
      padding: 25px 15px 35px;
    }

    .contenedor {
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
    }

    /* =========================
       MARCA
    ========================= */

    .marca {
      text-align: center;
      margin-bottom: 22px;
    }

    .logo-simbolo {
      width: 58px;
      height: 58px;
      margin: 0 auto 8px;
      position: relative;
    }

    .logo-hoja {
      position: absolute;
      width: 25px;
      height: 25px;
      background: #5aa832;
      border-radius: 70% 20% 70% 20%;
      transform: rotate(45deg);
    }

    .hoja-1 {
      left: 5px;
      top: 15px;
    }

    .hoja-2 {
      right: 5px;
      top: 15px;
      transform: rotate(135deg);
    }

    .hoja-3 {
      left: 17px;
      top: 3px;
      transform: rotate(90deg);
    }

    .hoja-4 {
      left: 17px;
      bottom: 2px;
      transform: rotate(-90deg);
    }

    .logo-centro {
      position: absolute;
      width: 18px;
      height: 18px;
      background: #ffffff;
      border-radius: 50%;
      left: 20px;
      top: 20px;
      z-index: 2;
    }

    .nombre-alival {
      font-size: 38px;
      font-weight: 700;
      font-style: italic;
      letter-spacing: -2px;
      color: #df2027;
      line-height: 1;
    }

    .nombre-alival span {
      color: #0066a6;
    }

    .subtitulo-marca {
      margin-top: 6px;
      font-size: 13px;
      color: #0066a6;
      font-weight: 600;
    }

    /* =========================
       TARJETA
    ========================= */

    .tarjeta {
      background: #ffffff;
      border-radius: 20px;
      padding: 28px 22px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
      border: 1px solid #e5e9ec;
    }

    .titulo {
      text-align: center;
      color: #0066a6;
      font-size: 24px;
      margin: 0 0 8px;
      font-weight: 700;
    }

    .descripcion {
      text-align: center;
      color: #68757d;
      font-size: 14px;
      line-height: 1.5;
      margin: 0 0 25px;
    }

    /* =========================
       FORMULARIO
    ========================= */

    .campo {
      margin-bottom: 17px;
    }

    .campo label {
      display: block;
      font-size: 14px;
      font-weight: 700;
      color: #37474f;
      margin-bottom: 7px;
    }

    .campo input {
      width: 100%;
      padding: 14px 15px;
      border: 1px solid #cfd8dc;
      border-radius: 11px;
      font-size: 16px;
      outline: none;
      background: #fafcfd;
      transition: 0.2s;
    }

    .campo input:focus {
      border-color: #0066a6;
      box-shadow: 0 0 0 3px rgba(0, 102, 166, 0.10);
      background: #ffffff;
    }

    /* =========================
       BOTONES
    ========================= */

    .boton {
      width: 100%;
      border: none;
      border-radius: 11px;
      padding: 14px 16px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s;
    }

    .boton-principal {
      background: #0066a6;
      color: white;
    }

    .boton-principal:hover {
      background: #005487;
    }

    .boton-principal:active {
      transform: scale(0.99);
    }

    .boton-secundario {
      background: #eef3f5;
      color: #455a64;
      margin-top: 20px;
    }

    .boton-secundario:hover {
      background: #e2e9ec;
    }

    .boton-documento {
      background: #0066a6;
      color: white;
      padding: 10px 13px;
      font-size: 13px;
      width: auto;
      min-width: 105px;
    }

    .boton-documento:hover {
      background: #005487;
    }

    /* =========================
       MENSAJES
    ========================= */

    .mensaje {
      display: none;
      padding: 12px 14px;
      border-radius: 10px;
      margin-bottom: 18px;
      font-size: 14px;
      line-height: 1.4;
    }

    .mensaje.error {
      display: block;
      background: #fdecec;
      color: #b42318;
      border: 1px solid #f5c2c0;
    }

    .mensaje.exito {
      display: block;
      background: #edf8e9;
      color: #397522;
      border: 1px solid #cce7c1;
    }

    /* =========================
       INFORMACIÓN PRODUCTOR
    ========================= */

    .datos-productor {
      background: #f2f7fa;
      border-left: 4px solid #0066a6;
      border-radius: 10px;
      padding: 15px;
      margin-bottom: 24px;
    }

    .dato-linea {
      margin-bottom: 7px;
      font-size: 14px;
    }

    .dato-linea:last-child {
      margin-bottom: 0;
    }

    .dato-label {
      color: #68757d;
    }

    .dato-valor {
      color: #263238;
      font-weight: 700;
    }

    /* =========================
       DOCUMENTOS
    ========================= */

    .seccion-documentos {
      margin-top: 10px;
    }

    .titulo-documentos {
      font-size: 19px;
      color: #0066a6;
      margin: 0 0 14px;
      font-weight: 700;
    }

    .documento {
      border: 1px solid #e1e7ea;
      border-radius: 13px;
      padding: 15px;
      margin-bottom: 12px;
      background: #ffffff;
    }

    .documento-cabecera {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .documento-info {
      min-width: 0;
      flex: 1;
    }

    .documento-periodo {
      font-size: 16px;
      font-weight: 700;
      color: #263238;
      margin-bottom: 5px;
    }

    .documento-tipo {
      font-size: 12px;
      font-weight: 700;
      color: #5aa832;
      text-transform: uppercase;
      margin-bottom: 5px;
    }

    .documento-nombre {
      font-size: 12px;
      color: #78909c;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .sin-documentos {
      text-align: center;
      background: #f7f9fa;
      border-radius: 12px;
      padding: 22px 15px;
      color: #78909c;
      font-size: 14px;
    }

    /* =========================
       PIE
    ========================= */

    .pie {
      text-align: center;
      margin-top: 20px;
      color: #90a4ae;
      font-size: 11px;
      line-height: 1.5;
    }

    /* =========================
       CARGANDO
    ========================= */

    .cargando {
      text-align: center;
      padding: 25px 10px;
      color: #607d8b;
      font-size: 14px;
    }

    .oculto {
      display: none !important;
    }

    /* =========================
       CELULARES PEQUEÑOS
    ========================= */

    @media (max-width: 400px) {

      .pagina {
        padding: 20px 10px 30px;
      }

      .tarjeta {
        padding: 23px 17px;
      }

      .nombre-alival {
        font-size: 34px;
      }

      .titulo {
        font-size: 22px;
      }

      .documento-cabecera {
        align-items: flex-start;
      }

      .boton-documento {
        min-width: 92px;
        padding: 9px 10px;
        font-size: 12px;
      }
    }
  </style>
</head>

<body>

  <div class="barra-superior">
    <div class="barra-verde"></div>
    <div class="barra-roja"></div>
    <div class="barra-azul"></div>
  </div>

  <div class="pagina">

    <div class="contenedor">

      <!-- MARCA -->

      <div class="marca">

        <div class="logo-simbolo">
          <div class="logo-hoja hoja-1"></div>
          <div class="logo-hoja hoja-2"></div>
          <div class="logo-hoja hoja-3"></div>
          <div class="logo-hoja hoja-4"></div>
          <div class="logo-centro"></div>
        </div>

       <div class="nombre-alival">
  <img
    src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTdPtuj_t3laXLzVqoCXlpTubQxMyN8eWD8u3Q3S_i0IA&s=10"
    alt="ALIVAL"
    style="max-width: 220px; width: 100%; height: auto;"
  >
</div>

        <div class="subtitulo-marca">
          Alimentos del Valle S.A.
        </div>

      </div>


      <!-- LOGIN -->

      <div id="login" class="tarjeta">

        <h1 class="titulo">
          Portal de Productores
        </h1>

        <p class="descripcion">
          Consulta y descarga tus documentos de calidad de manera rápida y segura.
        </p>

        <div id="mensajeLogin" class="mensaje"></div>

        <div class="campo">
          <label for="codigoFinca">
            Código de finca
          </label>

          <input
            type="text"
            id="codigoFinca"
            placeholder="Ejemplo: 1054"
            inputmode="numeric"
            autocomplete="off"
          >
        </div>

        <div class="campo">
          <label for="pin">
            PIN
          </label>

          <input
            type="password"
            id="pin"
            placeholder="Ingrese su PIN"
            inputmode="numeric"
            autocomplete="off"
          >
        </div>

        <button
          id="btnIngresar"
          class="boton boton-principal"
          type="button"
        >
          Ingresar
        </button>

      </div>


      <!-- PORTAL -->

      <div id="portal" class="tarjeta oculto">

        <div id="mensajePortal" class="mensaje"></div>

        <div class="datos-productor">

          <div class="dato-linea">
            <span class="dato-label">Productor:</span>
            <span id="nombreProductor" class="dato-valor"></span>
          </div>

          <div class="dato-linea">
            <span class="dato-label">Finca:</span>
            <span id="nombreFinca" class="dato-valor"></span>
          </div>

          <div class="dato-linea">
            <span class="dato-label">Código:</span>
            <span id="codigoFincaMostrar" class="dato-valor"></span>
          </div>

        </div>


        <div class="seccion-documentos">

          <h2 class="titulo-documentos">
            Mis documentos
          </h2>

          <div id="listaDocumentos">

            <div class="cargando">
              Cargando documentos...
            </div>

          </div>

        </div>


        <button
          id="btnCerrarSesion"
          class="boton boton-secundario"
          type="button"
        >
          Cerrar sesión
        </button>

      </div>


      <div class="pie">
        Portal de Productores ALIVAL<br>
        Alimentos del Valle S.A.
      </div>

    </div>

  </div>


  <script>

    let codigoFincaSesion = "";


    // ==========================================
    // INICIAR SESIÓN
    // ==========================================

    async function iniciarSesion() {

      const codigoFinca =
        document.getElementById("codigoFinca").value.trim();

      const pin =
        document.getElementById("pin").value.trim();

      const boton =
        document.getElementById("btnIngresar");

      limpiarMensaje("mensajeLogin");


      if (!codigoFinca || !pin) {

        mostrarMensaje(
          "mensajeLogin",
          "Por favor ingrese el código de finca y el PIN.",
          "error"
        );

        return;
      }


      boton.disabled = true;
      boton.textContent = "Ingresando...";


      try {

        const respuesta = await fetch(
          "/api/login",
          {
            method: "POST",

            headers: {
              "Content-Type": "application/json"
            },

            body: JSON.stringify({
              codigoFinca: codigoFinca,
              pin: pin
            })
          }
        );


        const resultado =
          await respuesta.json();


        if (!resultado.exito) {

          mostrarMensaje(
            "mensajeLogin",
            resultado.mensaje ||
            "Código de finca o PIN incorrecto.",
            "error"
          );

          return;
        }


        codigoFincaSesion =
          resultado.codigoFinca;


        document.getElementById(
          "nombreProductor"
        ).textContent =
          resultado.productor || "";


        document.getElementById(
          "nombreFinca"
        ).textContent =
          resultado.nombreFinca || "";


        document.getElementById(
          "codigoFincaMostrar"
        ).textContent =
          resultado.codigoFinca || "";


        document.getElementById(
          "login"
        ).classList.add("oculto");


        document.getElementById(
          "portal"
        ).classList.remove("oculto");


        await cargarDocumentos(
          resultado.codigoFinca
        );


      } catch (error) {

        mostrarMensaje(
          "mensajeLogin",
          "No fue posible conectarse con el portal: " +
          error.message,
          "error"
        );

      } finally {

        boton.disabled = false;
        boton.textContent = "Ingresar";

      }

    }


    // ==========================================
    // CARGAR DOCUMENTOS
    // ==========================================

    async function cargarDocumentos(codigoFinca) {

      const contenedor =
        document.getElementById("listaDocumentos");


      contenedor.innerHTML =
        '<div class="cargando">Cargando documentos...</div>';


      try {

        const respuesta = await fetch(
          "/api/documentos",
          {
            method: "POST",

            headers: {
              "Content-Type": "application/json"
            },

            body: JSON.stringify({
              codigoFinca: codigoFinca
            })
          }
        );


        const resultado =
          await respuesta.json();


        if (!resultado.exito) {

          contenedor.innerHTML =
            '<div class="sin-documentos">' +
            (resultado.mensaje ||
            'No fue posible cargar los documentos.') +
            '</div>';

          return;
        }


        const documentos =
          resultado.documentos || [];


        if (documentos.length === 0) {

          contenedor.innerHTML =
            '<div class="sin-documentos">' +
            'No hay documentos disponibles para esta finca.' +
            '</div>';

          return;
        }


        contenedor.innerHTML = "";


        documentos.forEach(function(doc) {

          const elemento =
            document.createElement("div");

          elemento.className =
            "documento";


          const periodo =
            (doc.mes || "") +
            " " +
            (doc.anio || "");


          const cabecera =
            document.createElement("div");

          cabecera.className =
            "documento-cabecera";


          const informacion =
            document.createElement("div");

          informacion.className =
            "documento-info";


          const tipo =
            document.createElement("div");

          tipo.className =
            "documento-tipo";

          tipo.textContent =
            doc.tipoDocumento || "DOCUMENTO";


          const periodoElemento =
            document.createElement("div");

          periodoElemento.className =
            "documento-periodo";

          periodoElemento.textContent =
            periodo;


          const nombre =
            document.createElement("div");

          nombre.className =
            "documento-nombre";

          nombre.textContent =
            doc.nombreArchivo || "";


          informacion.appendChild(tipo);
          informacion.appendChild(periodoElemento);
          informacion.appendChild(nombre);


          const boton =
            document.createElement("button");

          boton.className =
            "boton boton-documento";

          boton.type =
            "button";

          boton.textContent =
            "Ver documento";


          boton.addEventListener(
            "click",
            function() {

              verDocumento(
                codigoFinca,
                doc.anio,
                doc.mes
              );

            }
          );


          cabecera.appendChild(informacion);
          cabecera.appendChild(boton);

          elemento.appendChild(cabecera);

          contenedor.appendChild(elemento);

        });


      } catch (error) {

        contenedor.innerHTML =
          '<div class="sin-documentos">' +
          'Error al cargar documentos: ' +
          error.message +
          '</div>';

      }

    }


    // ==========================================
    // VER DOCUMENTO
    // ==========================================

    async function verDocumento(
      codigoFinca,
      anio,
      mes
    ) {

      const ventana =
        window.open("", "_blank");


      if (ventana) {

        ventana.document.write(
          "<html>" +
          "<head>" +
          "<title>Documento ALIVAL</title>" +
          "</head>" +
          "<body style='font-family:Arial;text-align:center;padding:40px;'>" +
          "<p>Cargando documento...</p>" +
          "</body>" +
          "</html>"
        );

      }


      try {

        const respuesta =
          await fetch(
            "/api/ver-documento",
            {
              method: "POST",

              headers: {
                "Content-Type": "application/json"
              },

              body: JSON.stringify({
                codigoFinca: String(codigoFinca).trim(),
                anio: String(anio).trim(),
                mes: String(mes).trim().toUpperCase()
              })
            }
          );


        const texto =
          await respuesta.text();


        let resultado;

        try {

          resultado =
            JSON.parse(texto);

        } catch (error) {

          throw new Error(
            "Vercel no devolvió un JSON válido. Respuesta: " +
            texto.substring(0, 300)
          );

        }


        if (!resultado.exito) {

          if (ventana) {
            ventana.close();
          }

          alert(
            resultado.mensaje ||
            "No fue posible obtener el documento."
          );

          return;
        }


        if (!resultado.archivoBase64) {

          if (ventana) {
            ventana.close();
          }

          alert(
            "El servidor encontró el documento, pero no recibió el archivo PDF."
          );

          return;
        }


        const byteCharacters =
          atob(resultado.archivoBase64);


        const byteNumbers =
          new Array(
            byteCharacters.length
          );


        for (
          let i = 0;
          i < byteCharacters.length;
          i++
        ) {

          byteNumbers[i] =
            byteCharacters.charCodeAt(i);

        }


        const byteArray =
          new Uint8Array(
            byteNumbers
          );


        const blob =
          new Blob(
            [byteArray],
            {
              type:
                resultado.tipoMime ||
                "application/pdf"
            }
          );


        const url =
          URL.createObjectURL(blob);


        if (ventana) {

          ventana.location.href =
            url;

        } else {

          window.open(
            url,
            "_blank"
          );

        }

      } catch (error) {

        if (ventana) {
          ventana.close();
        }

        alert(
          "ERROR AL ABRIR DOCUMENTO: " +
          error.message
        );

      }

    }


    // ==========================================
    // CERRAR SESIÓN
    // ==========================================

    function cerrarSesion() {

      codigoFincaSesion = "";


      document.getElementById(
        "codigoFinca"
      ).value = "";


      document.getElementById(
        "pin"
      ).value = "";


      document.getElementById(
        "portal"
      ).classList.add("oculto");


      document.getElementById(
        "login"
      ).classList.remove("oculto");


      limpiarMensaje(
        "mensajeLogin"
      );


      limpiarMensaje(
        "mensajePortal"
      );

    }


    // ==========================================
    // MOSTRAR MENSAJES
    // ==========================================

    function mostrarMensaje(
      id,
      texto,
      tipo
    ) {

      const elemento =
        document.getElementById(id);


      elemento.textContent =
        texto;


      elemento.className =
        "mensaje " + tipo;

    }


    function limpiarMensaje(id) {

      const elemento =
        document.getElementById(id);


      elemento.textContent =
        "";


      elemento.className =
        "mensaje";

    }


    // ==========================================
    // ENTER PARA INGRESAR
    // ==========================================

    document
      .getElementById("btnIngresar")
      .addEventListener(
        "click",
        iniciarSesion
      );


    document
      .getElementById("pin")
      .addEventListener(
        "keydown",
        function(event) {

          if (event.key === "Enter") {

            iniciarSesion();

          }

        }
      );


    // ==========================================
    // CERRAR SESIÓN
    // ==========================================

    document
      .getElementById("btnCerrarSesion")
      .addEventListener(
        "click",
        cerrarSesion
      );

  </script>

</body>
</html>
