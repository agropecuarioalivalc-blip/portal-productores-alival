<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Portal de Productores ALIVAL</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .contenedor {
      width: 100%;
      max-width: 420px;
      background: white;
      border-radius: 16px;
      padding: 35px 25px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.10);
      text-align: center;
    }

    .logo {
      font-size: 36px;
      font-weight: bold;
      margin-bottom: 5px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 24px;
    }

    .subtitulo {
      color: #666;
      margin-bottom: 30px;
    }

    .campo {
      text-align: left;
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: bold;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #ccc;
      border-radius: 9px;
      font-size: 16px;
    }

    input:focus {
      outline: none;
      border-color: #777;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 9px;
      background: #222;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 5px;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #mensaje {
      margin-top: 20px;
      font-size: 14px;
      min-height: 20px;
    }

    .exito {
      color: #16803c;
    }

    .error {
      color: #c62828;
    }

    .cargando {
      color: #666;
    }

    .resultado {
      margin-top: 25px;
      padding: 18px;
      background: #f4f6f8;
      border-radius: 10px;
      text-align: left;
    }

    .resultado strong {
      display: block;
      margin-bottom: 5px;
    }

    footer {
      margin-top: 30px;
      font-size: 12px;
      color: #888;
    }
  </style>
</head>

<body>

  <div class="contenedor">

    <div class="logo">ALIVAL</div>

    <h1>Portal de Productores</h1>

    <div class="subtitulo">
      Consulta tus documentos
    </div>

    <form id="formularioLogin">

      <div class="campo">
        <label for="codigoFinca">Código de finca</label>

        <input
          type="text"
          id="codigoFinca"
          placeholder="Ej. 1054"
          inputmode="numeric"
          autocomplete="username"
          required
        >
      </div>

      <div class="campo">
        <label for="pin">PIN</label>

        <input
          type="password"
          id="pin"
          placeholder="Ingresa tu PIN"
          inputmode="numeric"
          autocomplete="current-password"
          required
        >
      </div>

      <button type="submit" id="botonIngresar">
        Ingresar
      </button>

    </form>

    <div id="mensaje"></div>

    <div id="resultado" class="resultado" style="display:none;"></div>

    <footer>
      Portal de Productores ALIVAL
    </footer>

  </div>


  <script>

    const formulario = document.getElementById("formularioLogin");
    const botonIngresar = document.getElementById("botonIngresar");
    const mensaje = document.getElementById("mensaje");
    const resultado = document.getElementById("resultado");

    formulario.addEventListener("submit", async function(event) {

      event.preventDefault();

      const codigoFinca = document
        .getElementById("codigoFinca")
        .value
        .trim();

      const pin = document
        .getElementById("pin")
        .value
        .trim();

      mensaje.className = "cargando";
      mensaje.textContent = "Verificando acceso...";

      resultado.style.display = "none";

      botonIngresar.disabled = true;
      botonIngresar.textContent = "Verificando...";

      try {

        const respuesta = await fetch("/api/login", {

          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify({
            codigoFinca: codigoFinca,
            pin: pin
          })

        });

        const datos = await respuesta.json();

        if (datos.exito) {

          mensaje.className = "exito";
          mensaje.textContent = "Acceso correcto.";

          resultado.style.display = "block";

          resultado.innerHTML = `
            <strong>Bienvenido</strong>
            ${datos.productor || ""}
            <br><br>

            <strong>Finca</strong>
            ${datos.nombreFinca || ""}
            <br><br>

            <strong>Código</strong>
            ${datos.codigoFinca || codigoFinca}
          `;

        } else {

          mensaje.className = "error";
          mensaje.textContent =
            datos.mensaje || "Código de finca o PIN incorrecto.";

        }

      } catch (error) {

        mensaje.className = "error";
        mensaje.textContent =
          "No fue posible conectar con el servidor.";

      } finally {

        botonIngresar.disabled = false;
        botonIngresar.textContent = "Ingresar";

      }

    });

  </script>

</body>
</html>

  </script>

</body>
</html>
