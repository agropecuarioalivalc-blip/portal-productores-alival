<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Portal de Productores ALIVAL</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      padding: 20px;
    }

    .contenedor {
      width: 100%;
      max-width: 480px;
      margin: 30px auto;
      background: white;
      border-radius: 16px;
      padding: 30px 25px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.10);
    }

    .logo {
      text-align: center;
      font-size: 36px;
      font-weight: bold;
      margin-bottom: 5px;
    }

    h1 {
      text-align: center;
      margin: 0 0 8px;
      font-size: 24px;
    }

    .subtitulo {
      text-align: center;
      color: #666;
      margin-bottom: 30px;
    }

    .campo {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: bold;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #ccc;
      border-radius: 9px;
      font-size: 16px;
    }

    input:focus {
      outline: none;
      border-color: #777;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 9px;
      background: #222;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #mensaje {
      margin-top: 20px;
      text-align: center;
      font-size: 14px;
      min-height: 20px;
    }

    .exito {
      color: #16803c;
    }

    .error {
      color: #c62828;
    }

    .cargando {
      color: #666;
    }

    /* =========================
       PANEL DEL PRODUCTOR
       ========================= */

    #panelProductor {
      display: none;
    }

    .bienvenida {
      background: #f4f6f8;
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 25px;
    }

    .dato {
      margin-bottom: 15px;
    }

    .dato:last-child {
      margin-bottom: 0;
    }

    .dato-titulo {
      font-size: 12px;
      color: #777;
      margin-bottom: 4px;
      text-transform: uppercase;
    }

    .dato-valor {
      font-size: 16px;
      font-weight: bold;
    }

    .seccion-titulo {
      font-size: 20px;
      margin-bottom: 15px;
    }

    /* =========================
       DOCUMENTOS
       ========================= */

    .documento {
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 12px;
      background: white;
    }

    .documento-tipo {
      font-size: 13px;
      color: #777;
      margin-bottom: 5px;
    }

    .documento-periodo {
      font-size: 17px;
      font-weight: bold;
      margin-bottom: 12px;
    }

    .documento-nombre {
      font-size: 13px;
      color: #666;
      word-break: break-word;
      margin-bottom: 12px;
    }

    .boton-documento {
      background: #333;
    }

    .sin-documentos {
      background: #f4f6f8;
      border-radius: 10px;
      padding: 20px;
      text-align: center;
      color: #666;
    }

    .boton-salir {
      margin-top: 25px;
      background: white;
      color: #333;
      border: 1px solid #ccc;
    }

    footer {
      text-align: center;
      margin-top: 30px;
      font-size: 12px;
      color: #888;
    }

  </style>

</head>

<body>

  <div class="contenedor">

    <!-- =========================
         LOGIN
         ========================= -->

    <div id="pantallaLogin">

      <div class="logo">
        ALIVAL
      </div>

      <h1>
        Portal de Productores
      </h1>

      <div class="subtitulo">
        Consulta tus documentos
      </div>

      <form id="formularioLogin">

        <div class="campo">

          <label for="codigoFinca">
            Código de finca
          </label>

          <input
            type="text"
            id="codigoFinca"
            placeholder="Ej. 1054"
            inputmode="numeric"
            autocomplete="username"
            required
          >

        </div>


        <div class="campo">

          <label for="pin">
            PIN
          </label>

          <input
            type="password"
            id="pin"
            placeholder="Ingresa tu PIN"
            inputmode="numeric"
            autocomplete="current-password"
            required
          >

        </div>


        <button
          type="submit"
          id="botonIngresar"
        >
          Ingresar
        </button>

      </form>


      <div id="mensaje"></div>

    </div>


    <!-- =========================
         PANEL PRODUCTOR
         ========================= -->

    <div id="panelProductor">

      <div class="logo">
        ALIVAL
      </div>

      <h1>
        Portal de Productores
      </h1>


      <div class="bienvenida">

        <div class="dato">

          <div class="dato-titulo">
            Productor
          </div>

          <div
            class="dato-valor"
            id="nombreProductor"
          ></div>

        </div>


        <div class="dato">

          <div class="dato-titulo">
            Finca
          </div>

          <div
            class="dato-valor"
            id="nombreFinca"
          ></div>

        </div>


        <div class="dato">

          <div class="dato-titulo">
            Código
          </div>

          <div
            class="dato-valor"
            id="codigoFincaMostrar"
          ></div>

        </div>

      </div>


      <div class="seccion-titulo">
        Mis documentos
      </div>


      <div id="estadoDocumentos">
        Consultando documentos...
      </div>


      <div id="listaDocumentos"></div>


      <button
        type="button"
        class="boton-salir"
        id="botonSalir"
      >
        Cerrar sesión
      </button>

    </div>


    <footer>
      Portal de Productores ALIVAL
    </footer>

  </div>


  <script>

    const formulario =
      document.getElementById("formularioLogin");

    const botonIngresar =
      document.getElementById("botonIngresar");

    const mensaje =
      document.getElementById("mensaje");

    const pantallaLogin =
      document.getElementById("pantallaLogin");

    const panelProductor =
      document.getElementById("panelProductor");

    const nombreProductor =
      document.getElementById("nombreProductor");

    const nombreFinca =
      document.getElementById("nombreFinca");

    const codigoFincaMostrar =
      document.getElementById("codigoFincaMostrar");

    const estadoDocumentos =
      document.getElementById("estadoDocumentos");

    const listaDocumentos =
      document.getElementById("listaDocumentos");

    const botonSalir =
      document.getElementById("botonSalir");


    /* =========================
       LOGIN
       ========================= */

    formulario.addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();


        const codigoFinca =
          document
            .getElementById("codigoFinca")
            .value
            .trim();


        const pin =
          document
            .getElementById("pin")
            .value
            .trim();


        mensaje.className = "cargando";
        mensaje.textContent =
          "Verificando acceso...";


        botonIngresar.disabled = true;
        botonIngresar.textContent =
          "Verificando...";


        try {

          const respuesta =
            await fetch(
              "/api/login",
              {
                method: "POST",

                headers: {
                  "Content-Type":
                    "application/json"
                },

                body: JSON.stringify({
                  codigoFinca: codigoFinca,
                  pin: pin
                })
              }
            );


          const datos =
            await respuesta.json();


          if (!datos.exito) {

            mensaje.className = "error";

            mensaje.textContent =
              datos.mensaje ||
              "Código de finca o PIN incorrecto.";

            return;
          }


          /* =========================
             LOGIN CORRECTO
             ========================= */

          const tokenSesion = datos.token;
const codigoFincaSesion = datos.codigoFinca;

          pantallaLogin.style.display =
            "none";

          panelProductor.style.display =
            "block";


          nombreProductor.textContent =
            datos.productor || "";


          nombreFinca.textContent =
            datos.nombreFinca || "";


          codigoFincaMostrar.textContent =
            datos.codigoFinca ||
            codigoFinca;


          await cargarDocumentos(
            datos.codigoFinca ||
            codigoFinca
          );

        }

        catch (error) {

          mensaje.className = "error";

          mensaje.textContent =
            "No fue posible conectar con el servidor.";

        }

        finally {

          botonIngresar.disabled =
            false;

          botonIngresar.textContent =
            "Ingresar";

        }

      }
    );


    /* =========================
       CONSULTAR DOCUMENTOS
       ========================= */

    async function cargarDocumentos(
      codigoFinca
    ) {

      estadoDocumentos.textContent =
        "Consultando documentos...";

      listaDocumentos.innerHTML = "";


      try {

       const respuesta =
  await fetch(
    "/api/documentos",
    {
      method: "POST",

      headers: {
        "Content-Type":
          "application/json",
        "Authorization":
          "Bearer " + tokenSesion
      },

      body: JSON.stringify({
        codigoFinca: codigoFinca
      })
    }
  );


        const datos =
          await respuesta.json();


        if (!datos.exito) {

          estadoDocumentos.textContent =
            datos.mensaje ||
            "No fue posible consultar los documentos.";

          return;
        }


        const documentos =
          datos.documentos || [];


        if (documentos.length === 0) {

          estadoDocumentos.textContent = "";

          listaDocumentos.innerHTML = `
            <div class="sin-documentos">
              No hay documentos disponibles.
            </div>
          `;

          return;
        }


        estadoDocumentos.textContent =
          "Documentos disponibles:";


        documentos.forEach(
          function(documento) {

            const tarjeta =
              document.createElement("div");

            tarjeta.className =
              "documento";


            const tipo =
              document.createElement("div");

            tipo.className =
              "documento-tipo";

            tipo.textContent =
              documento.tipoDocumento ||
              "DOCUMENTO";


            const periodo =
              document.createElement("div");

            periodo.className =
              "documento-periodo";

            periodo.textContent =
              (documento.mes || "") +
              " " +
              (documento.anio || "");


            const nombre =
              document.createElement("div");

            nombre.className =
              "documento-nombre";

            nombre.textContent =
              documento.nombreArchivo ||
              "";


            const boton =
              document.createElement("button");

            boton.type = "button";

            boton.className =
              "boton-documento";

            boton.textContent =
              "Ver documento";


           boton.addEventListener(
  "click",
  async function() {

    boton.disabled = true;
    boton.textContent = "Cargando...";

    try {

      const respuesta = await fetch(
        "/api/ver-documento",
        {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
  codigoFinca: codigoFinca,
  anio: documento.anio,
  mes: documento.mes
})
        }
      );

      const resultado = await respuesta.json();

      if (!resultado.exito) {
        throw new Error(
          resultado.mensaje ||
          "No fue posible obtener el documento."
        );
      }

      const binario =
  atob(resultado.archivoBase64);

const bytes =
  new Uint8Array(binario.length);

for (let i = 0; i < binario.length; i++) {
  bytes[i] = binario.charCodeAt(i);
}

const blob =
  new Blob(
    [bytes],
    {
      type: resultado.tipoMime
    }
  );

const url =
  URL.createObjectURL(blob);

window.open(
  url,
  "_blank"
);

    }
    catch (error) {

      alert(
        error.message ||
        "No fue posible abrir el documento."
      );

    }
    finally {

      boton.disabled = false;
      boton.textContent = "Ver documento";

    }

  }
);


            tarjeta.appendChild(tipo);

            tarjeta.appendChild(periodo);

            tarjeta.appendChild(nombre);

            tarjeta.appendChild(boton);


            listaDocumentos.appendChild(
              tarjeta
            );

          }
        );

      }

      catch (error) {

        estadoDocumentos.textContent =
          "No fue posible consultar los documentos.";

      }

    }


    /* =========================
       CERRAR SESIÓN
       ========================= */

    botonSalir.addEventListener(
      "click",
      function() {

        panelProductor.style.display =
          "none";

        pantallaLogin.style.display =
          "block";


        document
          .getElementById("codigoFinca")
          .value = "";


        document
          .getElementById("pin")
          .value = "";


        mensaje.textContent = "";

        listaDocumentos.innerHTML = "";

      }
    );

  </script>

</body>

</html>
